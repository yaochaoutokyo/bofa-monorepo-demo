name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  auth-typescript:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/auth-typescript
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: services/auth-typescript/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:coverage

  validation-python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/validation-python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python -m pytest --cov=validation_service --cov-report=term-missing

  # transaction-java has no CI job yet. The service ships with JUnit 5 + JaCoCo,
  # but nothing runs it on push; see README.md ("Why Java is missing from CI").
